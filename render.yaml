# Render Blueprint — free web service (Docker: UI + API) + free Postgres.
# Dashboard: New → Blueprint → this repo. Web and database must stay in
# the same region so DATABASE_URL is the internal connection string.
#
# Free-tier limits (Render Hobby workspace):
#   Web: sleeps after 15 min idle (~1 min wake); 750 instance-hours/month.
#   Postgres: 1 GB disk, no backups, expires 30 days after creation
#             (14-day grace to upgrade before Render deletes the data).
# Singapore is closest to India; change both regions together if needed.

services:
  - type: web
    name: ledger-and-card
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DATA
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AGENT_SERVICE_URL
        # Render gives every service an internal hostname on the private
        # network; only the web service is reachable from the internet.
        value: http://ledger-ai-agent:8100
      - key: AGENT_SERVICE_TOKEN
        fromService:
          name: ledger-ai-agent
          type: pserv
          envVarKey: AGENT_SERVICE_TOKEN

  # The household finance agent. A private service: it can read every
  # household's books, so it must not be reachable from the internet —
  # only the web service calls it, over Render's private network.
  - type: pserv
    name: ledger-ai-agent
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./ai-agent/Dockerfile
    dockerContext: ./ai-agent
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: AGENT_SERVICE_TOKEN
        generateValue: true
      # The agent talks to an Ollama host. Render has no GPU plan that
      # will run one, so point this at an Ollama you host yourself
      # (a VM, a home box over a tunnel) and set it in the dashboard —
      # the URL is deployment-specific and may carry a credential.
      # Leave it unset and /agent/* answers 503 while the deterministic
      # /analysis/* endpoints carry on.
      - key: OLLAMA_BASE_URL
        sync: false
      - key: AGENT_MODEL
        value: llama3.1:8b
      - key: AGENT_NUM_CTX
        value: "16384"
      - key: PORT
        value: "8100"

databases:
  - name: ledger-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: ledger
    user: ledger
    # Open so you can restore the local Docker dump from your laptop.
    # After the restore, tighten this in the Render dashboard if you want.
    ipAllowList:
      - source: 0.0.0.0/0
        description: restore-from-anywhere-then-tighten
