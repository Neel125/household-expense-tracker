# Render Blueprint — free web service (Docker: UI + API) + free Postgres.
# Dashboard: New → Blueprint → this repo. Web and database must stay in
# the same region so DATABASE_URL is the internal connection string.
#
# Free-tier limits (Render Hobby workspace):
#   Web: sleeps after 15 min idle (~1 min wake); 750 instance-hours/month.
#   Postgres: 1 GB disk, no backups, expires 30 days after creation
#             (14-day grace to upgrade before Render deletes the data).
# Singapore is closest to India; change both regions together if needed.

services:
  - type: web
    name: ledger-and-card
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DATA
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: ledger-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: ledger
    user: ledger
    diskSizeGB: 1
    # Open so you can restore the local Docker dump from your laptop.
    # After the restore, tighten this in the Render dashboard if you want.
    ipAllowList:
      - source: 0.0.0.0/0
        description: restore-from-anywhere-then-tighten
